<meta charset="utf-8">
<title>Derrick is the Dungeon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* One dark world (a deliberate single theme). Layout: full-height column: HUD strip, glyph map, log, controls; combat is an overlay panel. */
:root{
  --bg:#140d10; --panel:#1f151a; --line:#3a2a31; --bone:#ece3d3; --dim:#9a8a8f;
  --floor:#4a3b40; --art:#e0474f; --ven:#6c8fe0; --bile:#d9b44a; --ok:#6fcf8a; --map-bg:#0c0809; --accent:#e0474f;
  --disp:"Pixelify Sans",ui-monospace,monospace; --body:"Atkinson Hyperlegible",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--bone);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#app{height:100%;max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--disp);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:30px} h3{font-size:18px}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--bile)}
.dim{color:var(--dim)} .small{font-size:13px} .warn{color:var(--bile);margin:0}
button{font:inherit;color:var(--bone);cursor:pointer}
button:focus-visible{outline:2px solid var(--bile);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 14px;min-height:40px}
.btn:hover:not(:disabled){border-color:var(--bile)}
.btn.primary{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--panel))}
.btn.danger{border-color:var(--art);color:var(--art)}
.btn.small{padding:4px 10px;min-height:30px;font-size:13px}
kbd{font-family:var(--mono);color:var(--bile);margin-right:8px}
.chip{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--dim);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok)} .chip.danger{color:var(--art);border-color:var(--art)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.bar{height:8px;background:#000;border-radius:2px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--art);transition:width .25s}
.bar.rt i{background:var(--bile)} .bar.atp i{background:var(--ven)} .bar.xp i{background:var(--bile)} .bar.mas i{background:var(--ok)}
.screen{height:100%;display:flex;flex-direction:column;gap:12px;min-height:0}
.screen.center{justify-content:center;align-items:flex-start;max-width:560px;margin:0 auto}
.logo{font-size:clamp(30px,8vw,48px);color:var(--bone);text-shadow:0 0 18px color-mix(in srgb,var(--art) 55%,transparent)}
.lede{font-size:17px;margin:0;max-width:46ch}
.stack{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
/* menu */
.screen.menu{overflow-y:auto;padding-bottom:16px;height:auto;min-height:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.region{border-left:4px solid var(--accent)} .region.locked{opacity:.6}
.rhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mastery{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
/* game */
.screen.game{position:relative;gap:8px}
.hud{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.floorname{font-family:var(--disp);font-size:18px;font-weight:700;min-width:7em} .floorname small{display:block;font:12px var(--body);color:var(--dim)}
.stat{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums} .stat b{color:var(--bone)}
.hud .btn{margin-left:auto}
.mapbox{flex:1;min-height:120px;background:var(--map-bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
.mapbox canvas{position:absolute;inset:0;display:block}
.log{font-size:13px;color:var(--dim);min-height:4.2em;display:flex;flex-direction:column;gap:2px} .log div:first-child{color:var(--bone)}
.controls{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,46px);gap:5px;
  grid-template-areas:". u ." "l d r"}
.key{background:var(--panel);border:1px solid var(--line);border-radius:6px;font:700 20px var(--mono);touch-action:manipulation}
.key.u{grid-area:u}.key.l{grid-area:l}.key.d{grid-area:d}.key.r{grid-area:r}
.key:active{background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--dim);flex:1;min-width:200px}
.legend b{font-family:var(--mono);margin-right:4px}
.gp{color:#fff}.gm{color:var(--art)}.gg{color:var(--bile)}.gd{color:var(--bile)}.gs{color:var(--bone)}
/* combat */
.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:12px;z-index:5}
.cbox{width:min(600px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.foe{display:flex;gap:14px;align-items:center}
.glyph{font:800 48px var(--mono);width:60px;text-align:center;color:var(--art);text-shadow:0 0 16px var(--art)}
.foeinfo{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0} .foeinfo h2{font-size:20px}
.intent{display:flex;gap:10px;align-items:baseline;border:1px solid var(--line);border-radius:5px;padding:8px 12px}
.intent b{font-family:var(--disp);font-size:18px}
.intent.danger{border-color:var(--art);color:var(--art)} .intent.guard{border-color:var(--ven);color:var(--ven)} .intent.ask{border-color:var(--bile);color:var(--bile)}
.me{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px} .me .chips{grid-column:1/-1}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.actions .btn{text-align:left;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 0;line-height:1.25}
.actions .btn small{flex-basis:100%;color:var(--dim);font-size:11px;margin-left:22px}
.actions .btn.ability{grid-column:1/-1}
.actions .btn .adesc{overflow-wrap:anywhere}
.actions .btn .acost{font-family:var(--mono);color:var(--bile)}
.rmnote{font-family:var(--mono);font-size:11px;color:var(--ok);margin:-2px 0 6px}
.qtag{font-size:12px;color:var(--bile);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q{font-size:17px;line-height:1.45;margin:0;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:#00000040;border:1px solid var(--line);border-radius:5px;padding:10px 12px;display:flex}
.opt:hover:not(:disabled){border-color:var(--bile)}
.opt:disabled{opacity:1;cursor:default}
.opt.right{border-color:var(--ok);background:#6fcf8a22}.opt.wrong{border-color:var(--art);background:#e0474f22}
.fb{font-size:14px;border-left:3px solid var(--bile);padding-left:10px}
.fb.good{border-color:var(--ok)} .fb.bad{border-color:var(--art)}
.clog{font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px;min-height:3.6em}
.clog div:first-child{color:var(--bone)}
.toolrow2{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.cls.current{border-color:var(--ok)}
.ratings{display:flex;flex-direction:column;gap:4px}
.rate{display:grid;grid-template-columns:4.2em 1fr 2.4em 2.6em;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
.rate b{color:var(--bone);font-family:var(--mono);font-weight:500} .rate small{text-align:right;font-family:var(--mono)}
.codex{margin:0;line-height:1.5}
.timer{height:5px;background:#000;border-radius:2px;overflow:hidden;margin:2px 0 4px} .timer i{display:block;height:100%;background:var(--bile)} .timer.spent i{background:var(--line)}
/* 4a: question writer, flags, fading */
textarea{font:inherit;color:var(--bone);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 10px;min-width:0;width:100%;resize:vertical}
textarea:focus-visible{outline:2px solid var(--bile);outline-offset:1px}
.qrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.qrow .q{flex:1;min-width:0;margin:0}
.flagbtn{flex:none;white-space:nowrap}.flagbtn.on{border-color:var(--bile);color:var(--bile)}
.qcard.kept{border-color:var(--ok)}
.chip.fading{color:var(--bile);border-color:var(--bile)}
/* lab images */
[hidden]{display:none!important}
.toolrow{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.filter{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn[aria-pressed=true]{border-color:var(--accent)}
.imgbtn{display:block;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--map-bg);cursor:zoom-in;width:100%;overflow:hidden}
.qimg{display:block;width:100%;height:auto;max-height:42vh;object-fit:contain}
.zoom{position:fixed;inset:0;z-index:20;background:#000e;display:grid;place-items:center;padding:12px;cursor:zoom-out}
.zimg{max-width:100%;max-height:100%;object-fit:contain}
.zclose{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.ed-head{display:flex;gap:12px;align-items:center}.ed-head h1{font-size:26px}
.ed-group{display:flex;flex-direction:column;gap:8px}
.ed-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.ed-card .thumb{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--map-bg);border-radius:4px}
.ed-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field.wide{grid-column:1/-1}
label{font-size:13px;color:var(--dim)}
input[type=text],select{font:inherit;color:var(--bone);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 10px;min-height:40px;min-width:0;width:100%}
input:focus-visible,select:focus-visible{outline:2px solid var(--bile);outline-offset:1px}
.stage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--map-bg)}
.edimg{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.bx{position:absolute;box-sizing:border-box;border:2px solid var(--bile);background:#d9b44a55;cursor:move}
.bx.sel{border-color:var(--accent);background:#e0474f55}
.bx.ghost{pointer-events:none;border-style:dashed}
.bx .n{position:absolute;left:2px;top:0;font:800 12px var(--mono);color:#fff;text-shadow:0 0 3px #000;pointer-events:none}
.bx .rz{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;background:var(--bone);border:2px solid var(--accent);border-radius:3px;cursor:nwse-resize;display:none}
.bx .x{position:absolute;right:-2px;top:-2px;width:26px;height:26px;padding:0;border:0;border-radius:3px;background:var(--art);color:#fff;font:800 16px/1 var(--mono);display:none;cursor:pointer}
.bx.sel .rz,.bx.sel .x{display:block}
.ed-boxes{display:flex;flex-direction:column;gap:8px}.bx-list{display:flex;flex-direction:column;gap:6px}
.bx-row{display:flex;gap:8px;align-items:center;border-radius:5px;padding:2px}.bx-row.sel{outline:1px solid var(--accent)}
.bx-n{font:800 13px var(--mono);color:var(--bile);width:1.6em;text-align:center;flex:none}
.shoprow{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px}
.shopinfo{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}.shopinfo>b{font-family:var(--disp);font-size:16px;font-weight:500;display:inline}
.shopinfo .chip{align-self:flex-start}
.chip.warn{color:var(--bile);border-color:var(--bile)}
.qcard .q{font-size:16px}
/* body map and travel (3a) */
.worldgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.bodybox{background:var(--map-bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;justify-content:center;max-width:460px;width:100%;margin:0 auto}
.bodycanvas{display:block;cursor:pointer;touch-action:manipulation}
.worldside{display:flex;flex-direction:column;gap:12px;min-width:0}
.place h3{font-size:20px}
.chipbtn{border-left:3px solid var(--accent)}
.chipbtn[aria-pressed=true]{border-color:var(--bone)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:6px 2px;scrollbar-width:thin}
.strip .stop{flex:none;font:12px var(--mono);border:1px solid var(--line);border-radius:3px;padding:2px 8px;color:var(--dim);white-space:nowrap}
.strip .stop.past{opacity:.45}.strip .stop.now{color:var(--bone);border-color:var(--bile);background:#d9b44a22}.strip .stop.goal{color:var(--bone);border-color:var(--ok)}
.strip.static{padding:2px}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:calc(100% - 24px);width:max-content;z-index:2;background:#140d10e8;border:1px solid var(--bile);border-radius:6px;padding:6px 12px;display:flex;flex-direction:column;gap:2px;text-align:center;pointer-events:none}
.banner b{font-family:var(--disp);font-size:17px;font-weight:500}.banner span{font-size:12px;color:var(--dim)}
.gc{color:#ff9ea6}.gv{color:var(--ok)}.gt{color:#ff7a59}
.dia{font:500 13px/1.25 var(--mono);color:var(--bone);margin:0;background:var(--map-bg);border:1px solid var(--line);border-radius:5px;padding:10px;overflow-x:auto;text-align:center;white-space:pre}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--dim)}.steps .now{color:var(--bone)}
.qorder{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:3px}.qorder li.ok{color:var(--ok)}.qorder li.bad{color:var(--art)}
.qchips .btn{text-align:left}
@media (min-width:760px){.worldgrid{grid-template-columns:minmax(0,460px) minmax(0,1fr)}.worldside{position:sticky;top:12px}}
@media (max-width:480px){.ed-fields{grid-template-columns:1fr}}
@media (max-width:480px){.me{grid-template-columns:1fr}.glyph{font-size:40px;width:48px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
