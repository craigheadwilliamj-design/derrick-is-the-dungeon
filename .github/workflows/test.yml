name: Game checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: find game -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run gameplay regression checks
        run: |
          node tests/content-unlocks.cjs
          node tests/combat-rework.cjs
          node tests/equipment.cjs
          node tests/exploration.cjs
